<div class="container">
  <div class="row mb-3">
    <div class="col">
      <button class="btn btn-info" *ngIf="isLoggedIn()" (click)="addTrip()">Add Trip</button>
    </div>
  </div>

  <div class="row">
    <div *ngFor="let trip of trips" class="col-md-4 mb-4">
      <app-trip-card [trip]="trip"></app-trip-card>
    </div>
  </div>
</div>
