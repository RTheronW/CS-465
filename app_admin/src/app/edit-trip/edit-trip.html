<div class="col-md-6 mx-auto">
  <h2 class="text-center mb-4">Edit Trip</h2>

  <form *ngIf="editForm" [formGroup]="editForm" (ngSubmit)="onSubmit()">

    <div class="mb-3">
      <label class="form-label">Code:</label>
      <input type="text" formControlName="code" class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['code'].errors }">
      <div *ngIf="submitted && f['code'].errors" class="invalid-feedback">
        <div *ngIf="f['code'].errors?.['required']">Trip Code is required</div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Name:</label>
      <input type="text" formControlName="name" class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['name'].errors }">
      <div *ngIf="submitted && f['name'].errors" class="invalid-feedback">
        <div *ngIf="f['name'].errors?.['required']">Name is required</div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Length:</label>
      <input type="text" formControlName="length" class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['length'].errors }">
      <div *ngIf="submitted && f['length'].errors" class="invalid-feedback">
        <div *ngIf="f['length'].errors?.['required']">Length is required</div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Start:</label>
      <input type="date" formControlName="start" class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['start'].errors }">
      <div *ngIf="submitted && f['start'].errors" class="invalid-feedback">
        <div *ngIf="f['start'].errors?.['required']">Date is required</div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Resort:</label>
      <input type="text" formControlName="resort" class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['resort'].errors }">
      <div *ngIf="submitted && f['resort'].errors" class="invalid-feedback">
        <div *ngIf="f['resort'].errors?.['required']">Resort is required</div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Per Person:</label>
      <input type="text" formControlName="perPerson" class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['perPerson'].errors }">
      <div *ngIf="submitted && f['perPerson'].errors" class="invalid-feedback">
        <div *ngIf="f['perPerson'].errors?.['required']">Per Person is required</div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Image Name:</label>
      <input type="text" formControlName="image" class="form-control"
             [ngClass]="{ 'is-invalid': submitted && f['image'].errors }">
      <div *ngIf="submitted && f['image'].errors" class="invalid-feedback">
        <div *ngIf="f['image'].errors?.['required']">Image Name is required</div>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Description:</label>
      <textarea formControlName="description" class="form-control" rows="3"
                [ngClass]="{ 'is-invalid': submitted && f['description'].errors }"></textarea>
      <div *ngIf="submitted && f['description'].errors" class="invalid-feedback">
        <div *ngIf="f['description'].errors?.['required']">Description is required</div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Save</button>
  </form>
</div>
